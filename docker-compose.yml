
services:
  mysql:
    image: mysql:8.4
    container_name: opspilot-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - opspilot_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  opspilot_mysql_data:
